<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="2532" viewBox="0 0 1170 2532">
  <defs>
    <radialGradient id="burst" cx="50%" cy="42%" r="75%">
      <stop stop-color="#4A3AA8"/>
      <stop offset=".5" stop-color="#2A1E6E"/>
      <stop offset="1" stop-color="#140F38"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#B9A8FF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#B9A8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tileGreen" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#3FBF7F"/>
      <stop offset=".55" stop-color="#1E8F57"/>
      <stop offset="1" stop-color="#0E5A37"/>
    </linearGradient>
    <linearGradient id="tileGreenEdge" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#9FF0C4"/>
      <stop offset=".5" stop-color="#2E9E62"/>
      <stop offset="1" stop-color="#0A4A2C"/>
    </linearGradient>
    <linearGradient id="tileOrange" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FF9A56"/>
      <stop offset=".55" stop-color="#E06428"/>
      <stop offset="1" stop-color="#96391A"/>
    </linearGradient>
    <linearGradient id="tileOrangeEdge" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFC890"/>
      <stop offset=".5" stop-color="#D96B2E"/>
      <stop offset="1" stop-color="#571804"/>
    </linearGradient>
    <linearGradient id="tileBlue" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#5AB8F5"/>
      <stop offset=".55" stop-color="#2E7FD6"/>
      <stop offset="1" stop-color="#1A4E96"/>
    </linearGradient>
    <linearGradient id="tileBlueEdge" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#BEE4FF"/>
      <stop offset=".5" stop-color="#4A9BDE"/>
      <stop offset="1" stop-color="#0E3A72"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFF3A8"/>
      <stop offset=".5" stop-color="#FFD23E"/>
      <stop offset="1" stop-color="#F09A1B"/>
    </linearGradient>
    <radialGradient id="gem" cx="40%" cy="35%" r="70%">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#FFE27A"/>
      <stop offset="1" stop-color="#E07E14"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFB36B"/>
      <stop offset=".55" stop-color="#E06428"/>
      <stop offset="1" stop-color="#9A3A10"/>
    </linearGradient>
    <linearGradient id="shieldCore" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFCF9F"/>
      <stop offset="1" stop-color="#E88440"/>
    </linearGradient>
    <radialGradient id="haloGreen" cx="50%" cy="50%" r="50%">
      <stop stop-color="#C8FFD9" stop-opacity=".8"/>
      <stop offset=".6" stop-color="#6FFFA8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#6FFFA8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloOrange" cx="50%" cy="50%" r="50%">
      <stop stop-color="#FFE0B8" stop-opacity=".8"/>
      <stop offset=".6" stop-color="#FFB36B" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FFB36B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloBlue" cx="50%" cy="50%" r="50%">
      <stop stop-color="#C8E8FF" stop-opacity=".8"/>
      <stop offset=".6" stop-color="#6FB8FF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#6FB8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".5"/>
      <stop offset=".6" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#E9C883"/>
      <stop offset="1" stop-color="#B98A48"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#3EC6B8"/>
      <stop offset="1" stop-color="#1E8C84"/>
    </linearGradient>
    <linearGradient id="pack" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#E08A4C"/>
      <stop offset="1" stop-color="#A85A24"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#241C5E"/>
      <stop offset="1" stop-color="#120D33"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#050818" stop-opacity="0"/>
      <stop offset=".5" stop-color="#050818" stop-opacity=".45"/>
      <stop offset="1" stop-color="#03040F" stop-opacity=".88"/>
    </linearGradient>
  </defs>

  <!-- Burst backdrop -->
  <rect width="1170" height="2532" fill="url(#burst)"/>

  <!-- Light rays -->
  <g opacity=".14" fill="#CBBFFF">
    <polygon points="585,1060 540,-200 630,-200"/>
    <polygon points="585,1060 220,-80 300,-120"/>
    <polygon points="585,1060 -60,300 -30,210"/>
    <polygon points="585,1060 -60,820 -10,730"/>
    <polygon points="585,1060 1230,300 1200,210"/>
    <polygon points="585,1060 1230,820 1180,730"/>
    <polygon points="585,1060 950,-80 870,-120"/>
    <polygon points="585,1060 180,1900 260,1960"/>
    <polygon points="585,1060 990,1900 910,1960"/>
  </g>

  <ellipse cx="585" cy="1060" rx="560" ry="480" fill="url(#coreGlow)"/>

  <!-- Stars -->
  <g fill="#FFFFFF">
    <circle cx="110" cy="140" r="4" opacity=".9"/><circle cx="330" cy="70" r="3" opacity=".7"/>
    <circle cx="640" cy="120" r="4.5" opacity=".9"/><circle cx="900" cy="60" r="3" opacity=".7"/>
    <circle cx="1070" cy="200" r="4" opacity=".85"/><circle cx="180" cy="420" r="3" opacity=".6"/>
    <circle cx="780" cy="280" r="3.5" opacity=".8"/><circle cx="500" cy="220" r="2.5" opacity=".6"/>
    <circle cx="1000" cy="470" r="3" opacity=".7"/><circle cx="60" cy="760" r="3" opacity=".6"/>
    <circle cx="1120" cy="800" r="3" opacity=".6"/>
    <path d="m90 560 5 13 13 5-13 5-5 13-5-13-13-5 13-5z" opacity=".8"/>
    <path d="m1090 600 5 13 13 5-13 5-5 13-5-13-13-5 13-5z" opacity=".8"/>
    <path d="m585 60 7 18 18 7-18 7-7 18-7-18-18-7 18-7z" opacity=".95"/>
  </g>

  <!-- Ground platform -->
  <ellipse cx="585" cy="2150" rx="620" ry="300" fill="url(#ground)"/>
  <ellipse cx="585" cy="2090" rx="480" ry="190" fill="#33277A" opacity=".7"/>
  <ellipse cx="585" cy="2050" rx="330" ry="120" fill="#4533A0" opacity=".55"/>

  <!-- Power-up tiles -->
  <!-- Exploration (compass star, green) — center, largest -->
  <g transform="translate(585 900)">
    <polygon points="0,-218 189,-109 189,109 0,218 -189,109 -189,-109" fill="url(#haloGreen)" transform="scale(1.35)"/>
    <polygon points="0,-200 173,-100 173,100 0,200 -173,100 -173,-100" fill="url(#tileGreenEdge)"/>
    <polygon points="0,-184 159,-92 159,92 0,184 -159,92 -159,-92" fill="url(#tileGreen)"/>
    <polygon points="0,-184 159,-92 159,-40 -159,-40 -159,-92" fill="url(#gloss)"/>
    <polygon points="0,-160 138,-80 138,80 0,160 -138,80 -138,-80" fill="none" stroke="#0A4A2C" stroke-opacity=".55" stroke-width="4"/>
    <!-- compass star -->
    <g>
      <path d="M0 -110 L26 -26 L110 0 L26 26 L0 110 L-26 26 L-110 0 L-26 -26 Z" fill="url(#star)" stroke="#8A4A0B" stroke-width="5" stroke-linejoin="round"/>
      <path d="M0 -110 L26 -26 L0 0 L-26 -26 Z" fill="#B8860B" opacity=".55"/>
      <path d="M110 0 L26 26 L0 0 L26 -26 Z" fill="#B8860B" opacity=".55"/>
      <path d="M0 110 L-26 26 L0 0 L26 26 Z" fill="#B8860B" opacity=".4"/>
      <path d="M-110 0 L-26 -26 L0 0 L-26 26 Z" fill="#B8860B" opacity=".3"/>
      <circle r="24" fill="url(#gem)" stroke="#8A4A0B" stroke-width="4"/>
      <circle cx="-7" cy="-7" r="7" fill="#FFFFFF" opacity=".8"/>
    </g>
    <path d="m-150 -120 5 12 12 5-12 5-5 12-5-12-12-5 12-5z" fill="#FFFFFF"/>
    <path d="m140 110 4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#FFFFFF" opacity=".9"/>
    <circle cx="150" cy="-90" r="5" fill="#FFFFFF" opacity=".9"/>
    <circle cx="-145" cy="80" r="4" fill="#FFFFFF" opacity=".8"/>
  </g>

  <!-- Fortification (shield, orange) — left -->
  <g transform="translate(245 1280) scale(.78)">
    <polygon points="0,-218 189,-109 189,109 0,218 -189,109 -189,-109" fill="url(#haloOrange)" transform="scale(1.35)"/>
    <polygon points="0,-200 173,-100 173,100 0,200 -173,100 -173,-100" fill="url(#tileOrangeEdge)"/>
    <polygon points="0,-184 159,-92 159,92 0,184 -159,92 -159,-92" fill="url(#tileOrange)"/>
    <polygon points="0,-184 159,-92 159,-40 -159,-40 -159,-92" fill="url(#gloss)"/>
    <polygon points="0,-160 138,-80 138,80 0,160 -138,80 -138,-80" fill="none" stroke="#571804" stroke-opacity=".55" stroke-width="4"/>
    <!-- shield -->
    <path d="M-60 -80 h120 v76 c0 48 -27 82 -60 99 -33 -17 -60 -51 -60 -99 z" fill="#FFC890"/>
    <path d="M-60 -80 h120 v76 c0 48 -27 82 -60 99 -33 -17 -60 -51 -60 -99 z" fill="url(#shield)" stroke="#8A3A12" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-60 -80 v-17 h20 v17 h27 v-17 h27 v17 h27 v-17 h19 v17 z" fill="url(#shield)" stroke="#8A3A12" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-40 -64 h80 v60 c0 35 -18 60 -40 73 -22 -13 -40 -38 -40 -73 z" fill="url(#shieldCore)"/>
    <path d="M0 -64 v133" stroke="#FFCF9F" stroke-width="5" stroke-linecap="round" opacity=".85"/>
    <path d="M-40 -34 h80" stroke="#FFCF9F" stroke-width="4" stroke-linecap="round" opacity=".6"/>
    <path d="m-140 -100 5 12 12 5-12 5-5 12-5-12-12-5 12-5z" fill="#FFFFFF"/>
    <circle cx="140" cy="90" r="5" fill="#FFFFFF" opacity=".9"/>
  </g>

  <!-- Revisit (circular arrow, blue) — right -->
  <g transform="translate(925 1280) scale(.78)">
    <polygon points="0,-218 189,-109 189,109 0,218 -189,109 -189,-109" fill="url(#haloBlue)" transform="scale(1.35)"/>
    <polygon points="0,-200 173,-100 173,100 0,200 -173,100 -173,-100" fill="url(#tileBlueEdge)"/>
    <polygon points="0,-184 159,-92 159,92 0,184 -159,92 -159,-92" fill="url(#tileBlue)"/>
    <polygon points="0,-184 159,-92 159,-40 -159,-40 -159,-92" fill="url(#gloss)"/>
    <polygon points="0,-160 138,-80 138,80 0,160 -138,80 -138,-80" fill="none" stroke="#0E3A72" stroke-opacity=".55" stroke-width="4"/>
    <!-- circular arrow -->
    <g>
      <circle r="86" fill="none" stroke="#FFFFFF" stroke-width="30" stroke-dasharray="420 120" stroke-linecap="round" transform="rotate(-30)" opacity=".95"/>
      <path d="M96 -56 L150 -30 L96 10 L82 -30 Z" fill="#FFFFFF" transform="rotate(16)"/>
      <circle r="30" fill="url(#gem)" stroke="#0E3A72" stroke-width="4"/>
      <path d="M-8 -10 L12 0 L-8 10 Z" fill="#0E3A72"/>
    </g>
    <path d="m140 -100 5 12 12 5-12 5-5 12-5-12-12-5 12-5z" fill="#FFFFFF"/>
    <circle cx="-140" cy="90" r="5" fill="#FFFFFF" opacity=".9"/>
  </g>

  <!-- Energy beams to tiles -->
  <g stroke="#B9A8FF" stroke-width="4" opacity=".35" stroke-linecap="round">
    <path d="M585 1900 Q560 1500 585 1120" fill="none"/>
    <path d="M500 1920 Q380 1650 260 1430" fill="none"/>
    <path d="M670 1920 Q790 1650 910 1430" fill="none"/>
  </g>

  <!-- Explorer reaching up -->
  <g transform="translate(585 1820)">
    <ellipse cx="0" cy="196" rx="100" ry="26" fill="#050820" opacity=".6"/>
    <!-- legs -->
    <rect x="-36" y="104" width="30" height="86" rx="14" fill="#3E5C41"/>
    <rect x="8" y="104" width="30" height="86" rx="14" fill="#3E5C41"/>
    <rect x="-44" y="176" width="46" height="24" rx="12" fill="#5A3B22"/>
    <rect x="2" y="176" width="46" height="24" rx="12" fill="#5A3B22"/>
    <!-- backpack -->
    <rect x="-92" y="-4" width="54" height="90" rx="20" fill="url(#pack)"/>
    <rect x="-84" y="28" width="38" height="28" rx="9" fill="#7A4418"/>
    <ellipse cx="-74" cy="8" rx="18" ry="10" fill="#F0A668" opacity=".7"/>
    <!-- body -->
    <rect x="-54" y="4" width="108" height="114" rx="40" fill="url(#shirt)"/>
    <rect x="-54" y="4" width="108" height="42" rx="21" fill="#FFFFFF" opacity=".14"/>
    <!-- raised arm -->
    <rect x="38" y="-72" width="26" height="86" rx="13" fill="url(#shirt)" transform="rotate(-24 51 -29)"/>
    <circle cx="72" cy="-80" r="15" fill="#F7C89A"/>
    <!-- left arm -->
    <rect x="-60" y="20" width="24" height="70" rx="12" fill="url(#shirt)" transform="rotate(16 -48 55)"/>
    <!-- head looking up -->
    <circle cx="0" cy="-58" r="52" fill="#F7C89A"/>
    <circle cx="-12" cy="-66" r="6" fill="#3A2A1A"/>
    <circle cx="20" cy="-66" r="6" fill="#3A2A1A"/>
    <path d="M-8 -34 q16 14 32 -2" stroke="#3A2A1A" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="-32" cy="-44" r="8" fill="#F0A068" opacity=".55"/>
    <circle cx="38" cy="-44" r="8" fill="#F0A068" opacity=".55"/>
    <!-- helmet -->
    <ellipse cx="0" cy="-86" rx="72" ry="20" fill="url(#hat)"/>
    <path d="M-52 -86 a52 44 0 0 1 104 0 z" fill="url(#hat)"/>
    <rect x="-52" y="-94" width="104" height="14" rx="7" fill="#8A5A28"/>
    <ellipse cx="-24" cy="-106" rx="20" ry="10" fill="#F4DDA6" opacity=".7"/>
  </g>

  <!-- Sparkles -->
  <g fill="#FFFFFF">
    <path d="m200 1750 6 16 16 6-16 6-6 16-6-16-16-6 16-6z" opacity=".8"/>
    <path d="m980 1750 6 16 16 6-16 6-6 16-6-16-16-6 16-6z" opacity=".8"/>
    <path d="m420 680 5 13 13 5-13 5-5 13-5-13-13-5 13-5z" opacity=".8"/>
    <path d="m760 680 5 13 13 5-13 5-5 13-5-13-13-5 13-5z" opacity=".8"/>
    <circle cx="330" cy="1000" r="5" opacity=".6"/>
    <circle cx="840" cy="1000" r="5" opacity=".6"/>
  </g>

  <!-- Bottom scrim -->
  <rect y="1980" width="1170" height="552" fill="url(#scrim)"/>
</svg>
