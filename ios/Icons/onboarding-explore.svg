<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="2532" viewBox="0 0 1170 2532">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#2B6CB0"/>
      <stop offset=".35" stop-color="#4C9BE0"/>
      <stop offset=".7" stop-color="#9FD4F5"/>
      <stop offset="1" stop-color="#D8F0FB"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#FFF7C9" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#FFE98A" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FFE98A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunCore" cx="42%" cy="38%" r="70%">
      <stop stop-color="#FFFBE0"/>
      <stop offset=".7" stop-color="#FFDF6B"/>
      <stop offset="1" stop-color="#F5B93B"/>
    </radialGradient>
    <linearGradient id="mtnFar" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#8FA8D8"/>
      <stop offset="1" stop-color="#6B84BE"/>
    </linearGradient>
    <linearGradient id="mtnSnow" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE8F7"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#7CC76F"/>
      <stop offset="1" stop-color="#57A85A"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#4F9E4E"/>
      <stop offset="1" stop-color="#35793F"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#2F7A3D"/>
      <stop offset="1" stop-color="#1C5428"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#E8C88F"/>
      <stop offset="1" stop-color="#C99A5B"/>
    </linearGradient>
    <linearGradient id="treeLeaf" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#5FBF66"/>
      <stop offset="1" stop-color="#2E7D3E"/>
    </linearGradient>
    <linearGradient id="treeLeafDark" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#3F9550"/>
      <stop offset="1" stop-color="#1F5C30"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#9A6B3F"/>
      <stop offset="1" stop-color="#6E4423"/>
    </linearGradient>
    <linearGradient id="hexTile" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#8FE3A9"/>
      <stop offset=".55" stop-color="#3FAF72"/>
      <stop offset="1" stop-color="#1E7A4E"/>
    </linearGradient>
    <linearGradient id="hexEdge" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#CFFFE0"/>
      <stop offset=".5" stop-color="#57C98C"/>
      <stop offset="1" stop-color="#0F5C3A"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#E9C883"/>
      <stop offset="1" stop-color="#B98A48"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#3EC6B8"/>
      <stop offset="1" stop-color="#1E8C84"/>
    </linearGradient>
    <linearGradient id="pack" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#E08A4C"/>
      <stop offset="1" stop-color="#A85A24"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#06182E" stop-opacity="0"/>
      <stop offset=".55" stop-color="#06182E" stop-opacity=".35"/>
      <stop offset="1" stop-color="#04101F" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCEDF9"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1170" height="2532" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="920" cy="330" r="330" fill="url(#sunGlow)"/>
  <g stroke="#FFE98A" stroke-width="14" stroke-linecap="round" opacity=".8">
    <line x1="920" y1="120" x2="920" y2="60"/>
    <line x1="920" y1="540" x2="920" y2="600"/>
    <line x1="710" y1="330" x2="650" y2="330"/>
    <line x1="1130" y1="330" x2="1170" y2="330"/>
    <line x1="772" y1="182" x2="730" y2="140"/>
    <line x1="1068" y1="182" x2="1110" y2="140"/>
    <line x1="772" y1="478" x2="730" y2="520"/>
    <line x1="1068" y1="478" x2="1110" y2="520"/>
  </g>
  <circle cx="920" cy="330" r="130" fill="url(#sunCore)"/>
  <ellipse cx="880" cy="295" rx="55" ry="38" fill="#FFFFFF" opacity=".45"/>

  <!-- Clouds -->
  <g fill="url(#cloud)" opacity=".95">
    <ellipse cx="240" cy="300" rx="130" ry="58"/>
    <ellipse cx="350" cy="270" rx="100" ry="48"/>
    <ellipse cx="160" cy="270" rx="80" ry="42"/>
    <ellipse cx="240" cy="330" rx="150" ry="40"/>
  </g>
  <g fill="url(#cloud)" opacity=".8">
    <ellipse cx="700" cy="620" rx="110" ry="46"/>
    <ellipse cx="800" cy="595" rx="85" ry="40"/>
    <ellipse cx="620" cy="598" rx="65" ry="34"/>
    <ellipse cx="710" cy="648" rx="125" ry="32"/>
  </g>
  <g fill="url(#cloud)" opacity=".65">
    <ellipse cx="170" cy="700" rx="90" ry="36"/>
    <ellipse cx="250" cy="680" rx="70" ry="30"/>
    <ellipse cx="180" cy="728" rx="100" ry="26"/>
  </g>

  <!-- Birds -->
  <g stroke="#33507A" stroke-width="7" stroke-linecap="round" fill="none" opacity=".8">
    <path d="M420 430 q18 -18 36 0 q18 -18 36 0"/>
    <path d="M520 480 q14 -14 28 0 q14 -14 28 0"/>
    <path d="M360 520 q12 -12 24 0 q12 -12 24 0"/>
  </g>

  <!-- Far mountains -->
  <path d="M-40 1080 L210 780 L360 960 L540 700 L700 950 L860 760 L1050 1000 L1210 840 L1210 1300 L-40 1300 Z" fill="url(#mtnFar)"/>
  <path d="M540 700 L610 830 L565 800 L540 850 L510 795 L470 830 Z" fill="url(#mtnSnow)"/>
  <path d="M210 780 L265 880 L228 858 L205 895 L182 856 L150 878 Z" fill="url(#mtnSnow)"/>
  <path d="M860 760 L922 872 L882 848 L858 890 L836 850 L800 872 Z" fill="url(#mtnSnow)"/>

  <!-- Floating hex tiles in the sky -->
  <g opacity=".9">
    <polygon points="180,880 235,912 235,975 180,1007 125,975 125,912" fill="url(#hexEdge)"/>
    <polygon points="180,890 226,916 226,969 180,995 134,969 134,916" fill="url(#hexTile)"/>
    <polygon points="180,890 226,916 226,940 134,940 134,916" fill="#FFFFFF" opacity=".28"/>
  </g>
  <g opacity=".75">
    <polygon points="1020,1080 1060,1103 1060,1149 1020,1172 980,1149 980,1103" fill="url(#hexEdge)"/>
    <polygon points="1020,1088 1053,1107 1053,1145 1020,1164 987,1145 987,1107" fill="url(#hexTile)"/>
  </g>
  <g opacity=".6">
    <polygon points="760,720 790,737 790,771 760,788 730,771 730,737" fill="url(#hexEdge)"/>
    <polygon points="760,727 784,741 784,768 760,782 736,768 736,741" fill="url(#hexTile)"/>
  </g>

  <!-- Back hill -->
  <path d="M-40 1150 Q250 1020 560 1130 Q850 1230 1210 1100 L1210 1600 L-40 1600 Z" fill="url(#hillBack)"/>

  <!-- Trees on back hill -->
  <g>
    <rect x="292" y="1080" width="26" height="80" rx="10" fill="url(#trunk)"/>
    <circle cx="305" cy="1040" r="72" fill="url(#treeLeafDark)"/>
    <circle cx="262" cy="1068" r="46" fill="url(#treeLeafDark)"/>
    <circle cx="348" cy="1068" r="46" fill="url(#treeLeafDark)"/>
    <ellipse cx="282" cy="1012" rx="34" ry="24" fill="#8FE3A9" opacity=".55"/>
  </g>
  <g>
    <rect x="872" y="1120" width="22" height="70" rx="9" fill="url(#trunk)"/>
    <circle cx="883" cy="1084" r="60" fill="url(#treeLeafDark)"/>
    <circle cx="846" cy="1108" r="38" fill="url(#treeLeafDark)"/>
    <circle cx="920" cy="1108" r="38" fill="url(#treeLeafDark)"/>
    <ellipse cx="862" cy="1060" rx="28" ry="20" fill="#8FE3A9" opacity=".5"/>
  </g>

  <!-- Mid hill -->
  <path d="M-40 1400 Q300 1240 640 1380 Q920 1490 1210 1330 L1210 2200 L-40 2200 Z" fill="url(#hillMid)"/>



  <!-- Front trees -->
  <g>
    <rect x="148" y="1560" width="34" height="110" rx="13" fill="url(#trunk)"/>
    <circle cx="165" cy="1500" r="95" fill="url(#treeLeaf)"/>
    <circle cx="108" cy="1540" r="60" fill="url(#treeLeaf)"/>
    <circle cx="222" cy="1540" r="60" fill="url(#treeLeaf)"/>
    <ellipse cx="132" cy="1462" rx="44" ry="30" fill="#A5ECB8" opacity=".6"/>
  </g>
  <g>
    <rect x="962" y="1620" width="30" height="100" rx="12" fill="url(#trunk)"/>
    <circle cx="977" cy="1566" r="84" fill="url(#treeLeaf)"/>
    <circle cx="926" cy="1600" r="52" fill="url(#treeLeaf)"/>
    <circle cx="1028" cy="1600" r="52" fill="url(#treeLeaf)"/>
    <ellipse cx="948" cy="1532" rx="38" ry="26" fill="#A5ECB8" opacity=".6"/>
  </g>

  <!-- Bushes -->
  <g fill="url(#treeLeafDark)">
    <ellipse cx="80" cy="1780" rx="90" ry="50"/>
    <ellipse cx="1090" cy="1760" rx="100" ry="55"/>
    <ellipse cx="330" cy="1720" rx="60" ry="34"/>
  </g>

  <!-- Flowers -->
  <g>
    <circle cx="250" cy="1850" r="10" fill="#FFD23E"/><circle cx="250" cy="1850" r="4" fill="#E07E14"/>
    <circle cx="890" cy="1830" r="10" fill="#FF9EC6"/><circle cx="890" cy="1830" r="4" fill="#C24B82"/>
    <circle cx="430" cy="1900" r="9" fill="#FFFFFF"/><circle cx="430" cy="1900" r="4" fill="#F5B93B"/>
    <circle cx="1020" cy="1900" r="9" fill="#FFD23E"/><circle cx="1020" cy="1900" r="4" fill="#E07E14"/>
    <circle cx="150" cy="1950" r="9" fill="#FF9EC6"/><circle cx="150" cy="1950" r="4" fill="#C24B82"/>
  </g>

  <!-- Front hill -->
  <path d="M-40 1980 Q320 1880 700 2020 Q980 2120 1210 2000 L1210 2532 L-40 2532 Z" fill="url(#hillFront)"/>
  <path d="M-40 1980 Q320 1880 700 2020 Q980 2120 1210 2000 L1210 2060 Q980 2180 700 2080 Q320 1940 -40 2040 Z" fill="#5FBF66" opacity=".35"/>

  <!-- Winding path (over the front hill) -->
  <path d="M540 2532 C500 2380 720 2300 660 2160 C610 2040 480 2000 545 1880 C585 1800 700 1780 660 1640 C640 1560 570 1520 640 1420"
        fill="none" stroke="url(#path)" stroke-width="86" stroke-linecap="round"/>
  <path d="M540 2532 C500 2380 720 2300 660 2160 C610 2040 480 2000 545 1880 C585 1800 700 1780 660 1640 C640 1560 570 1520 640 1420"
        fill="none" stroke="#F7E3B8" stroke-width="11" stroke-linecap="round" stroke-dasharray="4 54" opacity=".8"/>

  <!-- Explorer character -->
  <g transform="translate(620 1740)">
    <!-- shadow -->
    <ellipse cx="0" cy="182" rx="95" ry="24" fill="#0B3A1D" opacity=".45"/>
    <!-- legs -->
    <rect x="-34" y="96" width="28" height="80" rx="13" fill="#3E5C41"/>
    <rect x="8" y="96" width="28" height="80" rx="13" fill="#3E5C41"/>
    <rect x="-42" y="162" width="44" height="22" rx="11" fill="#5A3B22"/>
    <rect x="2" y="162" width="44" height="22" rx="11" fill="#5A3B22"/>
    <!-- backpack -->
    <rect x="36" y="-12" width="52" height="86" rx="20" fill="url(#pack)"/>
    <rect x="44" y="18" width="36" height="26" rx="9" fill="#7A4418"/>
    <ellipse cx="52" cy="0" rx="18" ry="10" fill="#F0A668" opacity=".7"/>
    <!-- body -->
    <rect x="-52" y="0" width="104" height="110" rx="40" fill="url(#shirt)"/>
    <rect x="-52" y="0" width="104" height="40" rx="20" fill="#FFFFFF" opacity=".14"/>
    <!-- arm + map -->
    <rect x="-96" y="16" width="52" height="24" rx="12" fill="url(#shirt)" transform="rotate(24 -70 28)"/>
    <rect x="-128" y="34" width="58" height="40" rx="6" fill="#F4E7C3" stroke="#B98A48" stroke-width="4" transform="rotate(18 -99 54)"/>
    <path d="M-118 44 l14 8 l16 -6 l12 10" stroke="#C24B4B" stroke-width="3.5" fill="none" transform="rotate(18 -99 54)"/>
    <rect x="52" y="20" width="46" height="22" rx="11" fill="url(#shirt)" transform="rotate(-18 75 31)"/>
    <!-- head -->
    <circle cx="0" cy="-58" r="52" fill="#F7C89A"/>
    <circle cx="-18" cy="-52" r="6" fill="#3A2A1A"/>
    <circle cx="18" cy="-52" r="6" fill="#3A2A1A"/>
    <path d="M-14 -34 q14 12 28 0" stroke="#3A2A1A" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="-34" cy="-40" r="8" fill="#F0A068" opacity=".55"/>
    <circle cx="34" cy="-40" r="8" fill="#F0A068" opacity=".55"/>
    <!-- pith helmet -->
    <ellipse cx="0" cy="-84" rx="72" ry="20" fill="url(#hat)"/>
    <path d="M-52 -84 a52 44 0 0 1 104 0 z" fill="url(#hat)"/>
    <rect x="-52" y="-92" width="104" height="14" rx="7" fill="#8A5A28"/>
    <ellipse cx="-24" cy="-104" rx="20" ry="10" fill="#F4DDA6" opacity=".7"/>
  </g>

  <!-- Compass rose accent -->
  <g transform="translate(985 780)" opacity=".95">
    <circle r="52" fill="#12325A" opacity=".25"/>
    <circle r="46" fill="#F7F3E4" stroke="#8A5A28" stroke-width="5"/>
    <path d="M0 -34 L10 -8 L34 0 L10 8 L0 34 L-10 8 L-34 0 L-10 -8 Z" fill="#E05A3A"/>
    <path d="M0 -34 L10 -8 L0 0 L-10 -8 Z" fill="#8A2A18"/>
    <circle r="6" fill="#8A5A28"/>
  </g>

  <!-- Sparkles -->
  <g fill="#FFFFFF">
    <path d="m300 1240 6 16 16 6-16 6-6 16-6-16-16-6 16-6z" opacity=".9"/>
    <path d="m1080 1340 5 13 13 5-13 5-5 13-5-13-13-5 13-5z" opacity=".8"/>
    <path d="m120 1180 4 11 11 4-11 4-4 11-4-11-11-4 11-4z" opacity=".8"/>
    <circle cx="500" cy="900" r="5" opacity=".7"/>
    <circle cx="860" cy="980" r="4" opacity=".6"/>
  </g>

  <!-- Bottom scrim for text -->
  <rect y="1700" width="1170" height="832" fill="url(#scrim)"/>
</svg>
